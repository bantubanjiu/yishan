<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>移山</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">采集控制台</p>
          <h1>移山</h1>
          <p class="subtitle">把当前页面、摘录、图片和截图送进今天的 Obsidian。</p>
        </div>
        <span class="mark" aria-hidden="true">山</span>
      </header>

      <section class="quick-actions" aria-label="立即采集">
        <button class="primary action-card" id="saveCurrentPage" type="button">
          <span>
            <strong>保存当前页面</strong>
            <small>剪藏正文为单独 Markdown</small>
          </span>
        </button>
        <button class="action-card" id="saveCurrentWindow" type="button">
          <span>
            <strong>保存当前窗口标签</strong>
            <small>保存全部普通网页链接</small>
          </span>
        </button>
        <div class="action-grid">
          <button class="action-card" id="captureScreenshot" type="button">
            <span>
              <strong>框选截图</strong>
              <small>拖拽选择区域</small>
            </span>
          </button>
          <button class="action-card" id="captureViewport" type="button">
            <span>
              <strong>保存当前视口</strong>
              <small>不是滚动长截图</small>
            </span>
          </button>
        </div>
      </section>

      <section class="summary-card" aria-label="当前状态">
        <div class="section-heading">
          <h2>保存状态</h2>
          <button class="ghost" id="reload" type="button">刷新</button>
        </div>
        <dl class="status-list">
          <div>
            <dt>Vault</dt>
            <dd id="vaultState">正在读取...</dd>
          </div>
          <div>
            <dt>拖选摘录</dt>
            <dd id="gestureSummary">正在读取...</dd>
          </div>
          <div>
            <dt>摘录模式</dt>
            <dd id="modeSummary">正在读取...</dd>
          </div>
          <div>
            <dt>快捷键状态</dt>
            <dd id="shortcutSummary">正在读取...</dd>
          </div>
        </dl>
        <div class="path-actions" aria-label="工具入口">
          <button class="ghost" id="openTodayInbox" type="button">打开今天 Inbox</button>
          <button class="ghost" id="openOptions" type="button">完整设置</button>
        </div>
      </section>

      <section class="help-card" aria-label="更多保存方式">
        <h2>更多保存方式</h2>
        <ul>
          <li>页面空白处右键：保存页面剪藏</li>
          <li>选中文本右键：保存摘录</li>
          <li>图片右键：保存图片</li>
          <li><kbd>Ctrl+Shift+S</kbd>：保存当前窗口标签</li>
          <li><kbd>Ctrl+Shift+X</kbd>：框选截图</li>
          <li>若显示未绑定或被占用，请打开 Chrome 快捷键设置重新绑定。</li>
        </ul>
        <button class="link-button" id="openShortcuts" type="button">打开 Chrome 快捷键设置</button>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">准备就绪。</p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
