<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>移山</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-container">
      <header class="header">
        <h1 class="logo">移山</h1>
        <button class="btn-secondary btn-small" id="openTodayInbox" type="button">
          <span class="icon" aria-hidden="true">📥</span>
          今日 Inbox
        </button>
      </header>

      <div class="content">
        <section class="section">
          <h2 class="section-title">采集内容</h2>
          <div class="actions-stack">
            <button class="action-card" id="saveCurrentPage" type="button">
              <div class="action-icon purple">
                <span class="icon">📄</span>
              </div>
              <div class="action-meta">
                <strong>保存当前页面</strong>
                <small>提取正文为 Markdown 文档</small>
              </div>
            </button>
            <button class="action-card" id="saveCurrentWindow" type="button">
              <div class="action-icon purple">
                <span class="icon">📚</span>
              </div>
              <div class="action-meta">
                <strong>保存当前窗口</strong>
                <small>保存全部普通网页链接</small>
              </div>
            </button>
          </div>
        </section>

        <section class="section">
          <div class="actions-grid">
            <button class="action-card vertical" id="captureScreenshot" type="button">
              <div class="action-icon purple">
                <span class="icon">✂️</span>
              </div>
              <strong>框选截图</strong>
            </button>
            <button class="action-card vertical" id="captureViewport" type="button">
              <div class="action-icon purple">
                <span class="icon">🖥️</span>
              </div>
              <strong>当前视口</strong>
            </button>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <h2 class="section-title">当前状态</h2>
            <button class="btn-text" id="reload" type="button">刷新</button>
          </div>
          <div class="status-card">
            <div class="status-item">
              <span class="label">Vault</span>
              <span class="value" id="vaultState">正在读取...</span>
            </div>
            <div class="status-item">
              <span class="label">拖选摘录</span>
              <span class="value" id="gestureSummary">正在读取...</span>
            </div>
            <div class="status-item hidden">
              <span class="label">摘录模式</span>
              <span class="value" id="modeSummary">正在读取...</span>
            </div>
            <div class="status-item">
              <span class="label">快捷键</span>
              <span class="value" id="shortcutSummary">正在读取...</span>
            </div>
          </div>
        </section>

        <footer class="footer">
          <button class="btn-link" id="openOptions" type="button">完整设置</button>
          <div class="divider"></div>
          <button class="btn-link" id="openShortcuts" type="button">快捷键</button>
        </footer>

        <p id="status" class="status-bar" role="status" aria-live="polite">准备就绪。</p>
      </div>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
