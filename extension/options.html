<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>移山设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header class="hero">
        <p class="eyebrow">Obsidian Web Clipper</p>
        <h1>完整设置与诊断</h1>
        <p class="hint">管理保存位置、摘录方式和快捷入口。Popup 负责快速采集，这里负责完整配置。</p>
      </header>

      <section class="panel" aria-label="保存设置">
        <label class="field">
          <span>Obsidian Vault 路径</span>
          <div class="input-row">
            <input id="vaultPath" autocomplete="off" placeholder="例如 D:\\Obsidian\\Vault" />
            <button id="chooseVault" type="button" class="secondary">选择文件夹</button>
          </div>
        </label>

        <label class="field compact-field">
          <span>选区快捷键</span>
          <select id="selectionModifier">
            <option value="Alt">Alt</option>
            <option value="Ctrl">Ctrl</option>
            <option value="Shift">Shift</option>
            <option value="Meta">Meta / Command</option>
          </select>
        </label>

        <label class="field compact-field">
          <span>选中文本保存模式</span>
          <select id="selectionSaveMode">
            <option value="plain">安全纯文本</option>
            <option value="rich">富 Markdown</option>
          </select>
        </label>

        <label class="field compact-field checkbox-field">
          <span>启用长按拖选自动保存</span>
          <input id="selectionGestureEnabled" type="checkbox" />
        </label>

        <div class="actions">
          <button id="save" class="primary" type="button">保存设置</button>
          <button id="reload" class="secondary" type="button">读取当前设置</button>
          <button id="openShortcuts" class="link-button" type="button">打开 Chrome 快捷键设置</button>
        </div>

        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel guide-panel" aria-label="快捷键与入口">
        <h2>快捷键与入口</h2>
        <div class="guide-grid">
          <article>
            <h3>快速采集</h3>
            <p>Popup 中可以保存当前页面、当前窗口标签、框选截图和当前视口截图。</p>
          </article>
          <article>
            <h3>右键菜单</h3>
            <p>页面空白处右键保存页面剪藏，选中文本右键保存摘录，图片右键保存图片。</p>
          </article>
          <article>
            <h3>键盘快捷键</h3>
            <p><kbd>Alt+Shift+S</kbd> 保存当前窗口标签；<kbd>Alt+Shift+X</kbd> 进入框选截图。</p>
          </article>
          <article>
            <h3>常见限制</h3>
            <p>浏览器内部页无法注入；file:// 页面需要开启扩展的“允许访问文件网址”；当前视口截图不是滚动长截图。</p>
          </article>
        </div>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
